<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModelArena - Yönetim Paneli</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0f0f1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        .floating-logos {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .floating-logo {
            position: absolute;
            border-radius: 16px;
            opacity: 0;
            animation: float linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(100vh); opacity: 0; }
            5% { opacity: 0.35; }
            95% { opacity: 0.35; }
            100% { transform: translateY(-120px); opacity: 0; }
        }

        .login-box {
            position: relative;
            z-index: 1;
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            border-radius: 20px;
            padding: 48px 40px;
            width: 400px;
            box-shadow: 0 0 40px rgba(108, 99, 255, 0.25), 0 0 80px rgba(168, 85, 247, 0.1), 0 20px 60px rgba(0,0,0,0.5);
        }

        .login-box::before {
            content: '';
            position: absolute;
            top: -1px; left: 10%; right: 10%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #6c63ff, #a855f7, transparent);
            border-radius: 2px;
        }

        .login-box::after {
            content: '';
            position: absolute;
            bottom: -1px; left: 10%; right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(108,99,255,0.3), transparent);
            border-radius: 2px;
        }

        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-logo img {
            width: 80px;
            height: 80px;
            filter: drop-shadow(0 0 12px rgba(108, 99, 255, 0.6));
        }

        .login-logo h1 {
            color: #ffffff;
            font-size: 1.8rem;
            font-weight: 700;
            margin-top: 12px;
            margin-bottom: 4px;
        }

        .login-logo p {
            color: #a0a0c0;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #a0a0c0;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            background: #0f0f1a;
            border: 1px solid #2a2a4a;
            color: #e0e0e0;
            border-radius: 10px;
            padding: 14px 16px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            border-color: #6c63ff;
            box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.2);
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #6c63ff, #a855f7);
            border: none;
            border-radius: 10px;
            color: white;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s, transform 0.2s;
        }

        .submit-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .error {
            background: rgba(231, 76, 60, 0.1);
            border: 1px solid rgba(231, 76, 60, 0.3);
            color: #e74c3c;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="floating-logos">
    <img class="floating-logo" src="https://www.google.com/s2/favicons?domain=chatgpt.com&sz=128" style="left:5%;width:80px;animation-duration:15s;animation-delay:0s;">
    <img class="floating-logo" src="https://www.google.com/s2/favicons?domain=claude.ai&sz=128" style="left:15%;width:70px;animation-duration:18s;animation-delay:3s;">
    <img class="floating-logo" src="https://www.google.com/s2/favicons?domain=gemini.google.com&sz=128" style="left:25%;width:85px;animation-duration:12s;animation-delay:6s;">
    <img class="floating-logo" src="https://www.google.com/s2/favicons?domain=deepseek.com&sz=128" style="left:38%;width:75px;animation-duration:20s;animation-delay:2s;">
    <img class="floating-logo" src="https://www.google.com/s2/favicons?domain=mistral.ai&sz=128" style="left:52%;width:80px;animation-duration:16s;animation-delay:8s;">
    <img class="floating-logo" src="https://www.google.com/s2/favicons?domain=perplexity.ai&sz=128" style="left:63%;width:70px;animation-duration:14s;animation-delay:4s;">
    <img class="floating-logo" src="https://www.google.com/s2/favicons?domain=grok.com&sz=128" style="left:73%;width:75px;animation-duration:17s;animation-delay:1s;">
    <img class="floating-logo" src="https://www.google.com/s2/favicons?domain=github.com&sz=128" style="left:83%;width:70px;animation-duration:13s;animation-delay:9s;">
    <img class="floating-logo" src="https://www.google.com/s2/favicons?domain=meta.com&sz=128" style="left:91%;width:75px;animation-duration:19s;animation-delay:5s;">
    <img class="floating-logo" src="https://www.google.com/s2/favicons?domain=x.ai&sz=128" style="left:10%;width:65px;animation-duration:22s;animation-delay:7s;">
</div>

<div class="login-box">
    <div class="login-logo">
        <img src="/static/img/logo.svg" alt="ModelArena">
        <h1>ModelArena</h1>
        <p>Yönetim Paneli</p>
    </div>

    {% if form.errors %}
    <div class="error">Kullanıcı adı veya şifre hatalı.</div>
    {% endif %}

    <form method="post" action="{{ app_path }}">
        {% csrf_token %}
        <div class="form-group">
            <label>Kullanıcı Adı</label>
            <input type="text" name="username" autofocus autocomplete="username" placeholder="Kullanıcı adın">
        </div>
        <div class="form-group">
            <label>Şifre</label>
            <input type="password" name="password" autocomplete="current-password" placeholder="Şifren">
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="submit-btn">Giriş Yap</button>
    </form>
</div>

</body>
</html>
