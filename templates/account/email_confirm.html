{% extends 'models_app/base.html' %}
{% block title %}| Giriş{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card p-5">
            <div class="text-center mb-4">
                <i class="bi bi-cpu" style="font-size:2.5rem;color:var(--primary)"></i>
                <h3 class="fw-bold mt-2">ModelArena'ya Giriş Yap</h3>
                <p class="text-secondary">Favori modellerini takip et, yorum yap</p>
            </div>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label text-secondary">Kullanıcı Adı veya Email</label>
                    <div class="input-group">
                        <span class="input-group-text" style="background:var(--card-bg);border-color:var(--card-border);color:var(--primary)">
                            <i class="bi bi-person"></i>
                        </span>
                        <input type="text" name="login" class="form-control" placeholder="Kullanıcı adın veya email">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label text-secondary">Şifre</label>
                    <div class="input-group">
                        <span class="input-group-text" style="background:var(--card-bg);border-color:var(--card-border);color:var(--primary)">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input type="password" name="password" class="form-control" placeholder="Şifren">
                    </div>
                </div>
                {% if form.errors %}
                <div class="alert alert-danger">Kullanıcı adı veya şifre hatalı.</div>
                {% endif %}
                <button type="submit" class="btn btn-primary w-100 py-2">
                    <i class="bi bi-box-arrow-in-right"></i> Giriş Yap
                </button>
            </form>
            <p class="text-center text-secondary mt-4">
                Hesabın yok mu? <a href="{% url 'account_signup' %}" class="text-primary fw-bold">Kayıt Ol</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
