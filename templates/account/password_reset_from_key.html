{% extends 'models_app/base.html' %}
{% block title %}| Yeni Şifre{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card p-5">
            <div class="text-center mb-4">
                <i class="bi bi-key-fill" style="font-size:2.5rem;color:var(--primary)"></i>
                <h3 class="fw-bold mt-2">Yeni Şifre Belirle</h3>
            </div>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label text-secondary">Yeni Şifre</label>
                    <div class="input-group">
                        <span class="input-group-text" style="background:var(--card-bg);border-color:var(--card-border);color:var(--primary)">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input type="password" name="password1" class="form-control" placeholder="Yeni şifren">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label text-secondary">Yeni Şifre Tekrar</label>
                    <div class="input-group">
                        <span class="input-group-text" style="background:var(--card-bg);border-color:var(--card-border);color:var(--primary)">
                            <i class="bi bi-lock-fill"></i>
                        </span>
                        <input type="password" name="password2" class="form-control" placeholder="Şifreni tekrar gir">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">
                    <i class="bi bi-check-circle"></i> Şifremi Güncelle
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
