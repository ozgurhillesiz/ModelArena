{% extends 'models_app/base.html' %}
{% block title %}| Şifre Sıfırla{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card p-5">
            <div class="text-center mb-4">
                <i class="bi bi-lock-fill" style="font-size:2.5rem;color:var(--primary)"></i>
                <h3 class="fw-bold mt-2">Şifreni Sıfırla</h3>
                <p class="text-secondary">Email adresini gir, sıfırlama linki gönderelim.</p>
            </div>
            <form method="post">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="form-label text-secondary">Email Adresi</label>
                    <div class="input-group">
                        <span class="input-group-text" style="background:var(--card-bg);border-color:var(--card-border);color:var(--primary)">
                            <i class="bi bi-envelope"></i>
                        </span>
                        <input type="email" name="email" class="form-control" placeholder="Email adresin">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">
                    <i class="bi bi-send"></i> Sıfırlama Linki Gönder
                </button>
            </form>
            <p class="text-center text-secondary mt-4">
                Şifreni hatırladın mı? <a href="{% url 'account_login' %}" class="text-primary fw-bold">Giriş Yap</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
